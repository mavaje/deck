<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <script type="module" src="./src.js"></script>
    <link id="favicon" rel="icon"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="background">
    <div id="search">
        <div id="search-controls">
            <input id="search-query" type="text">
            <button id="search-button">Search</button>
        </div>
        <div id="search-results" class="collapsed">
        </div>
    </div>
    <div id="divider"></div>
    <div id="deck" class="compact show-quantity">
        <div id="deck-controls">
            <div>
                <input id="deck-file-input" type="file">
                <button id="deck-upload-button">Import</button>

                <button id="deck-download-button">Export</button>
            </div>
            <div>
                <input id="by-board" type="checkbox" checked>
                <label for="by-board">By Board</label>
            </div>
            <div>
                <label for="group-by">Group by</label>
                <select id="group-by"></select>
            </div>
            <div>
                <label for="order-by">Order by</label>
                <select id="order-by"></select>
            </div>
        </div>
        <div id="deck-cards"></div>
    </div>
</div>
<div id="modals">
    <div id="card-edit-modal" class="modal"></div>
</div>
</body>
</html>
