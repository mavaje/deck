<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <script type="module" src="./src.js"></script>
    <link id="favicon" rel="icon"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="background">
    <div id="search">
        <div id="search-controls">
            <button id="search-collapse">+</button>
            <form id="search-form">
                <label for="search-query" class="hidden">Search</label>
                <div class="input-group">
                    <input
                        id="search-query"
                        type="text"
                        placeholder="Search"
                        enterkeyhint="search"
                    >
                    <button
                        id="search-clear"
                        type="button"
                        class="danger"
                    >×</button>
                </div>
            </form>
            <span id="search-status"></span>
        </div>
        <div id="search-results" class="collapsed">
        </div>
    </div>
    <div class="divider"></div>
    <div id="deck">
        <div id="deck-panel">
            <div>
                <input id="by-board" type="checkbox" checked>
                <label for="by-board">By Board</label>
            </div>
            <div>
                <label for="group-by">Group by</label>
                <select id="group-by"></select>
            </div>
            <div>
                <label for="order-by">Order by</label>
                <select id="order-by"></select>
            </div>
        </div>
        <div id="deck-cards" class="-compact -show-quantity"></div>
        <div id="card-panel" class="collapsed">
            <div id="card-panel-card-container"></div>
            <div>
                <label for="quantity-input">
                    Quantity
                </label>
                <div class="input-group">
                    <button id="quantity-decrement">-</button>
                    <input
                        id="quantity-input"
                        type="number"
                        min="0"
                        max="99"
                    >
                    <button id="quantity-increment">+</button>
                </div>
            </div>
            <div>
                <label for="name-input">
                    Name
                </label>
                <input
                    id="name-input"
                    type="text"
                >
            </div>
            <div>
                <label for="set-input">
                    Print
                </label>
                <input
                    id="set-input"
                    type="text"
                    placeholder="Set"
                >
                <label for="collector-number-input" class="hidden">
                    Collector Number
                </label>
                <input
                    id="collector-number-input"
                    type="text"
                    placeholder="Number"
                >
                <button id="print-search">
                    Search
                </button>
                <button id="print-clear">
                    Unset
                </button>
            </div>
            <div>
                <label for="language-input">
                    Language
                </label>
                <input
                    id="language-input"
                    type="text"
                >
            </div>
            <div>
                <label for="finish-input">
                    Finish
                </label>
                <input
                    id="finish-input"
                    type="text"
                >
            </div>
            <div>
                <label for="condition-input">
                    Condition
                </label>
                <input
                    id="condition-input"
                    type="text"
                    placeholder="Unspecified"
                >
            </div>
            <div>
                <label for="board-input">
                    Zone
                </label>
                <input
                    id="board-input"
                    type="text"
                >
            </div>
            <div>
                <button id="delete-card" class="danger">
                    Delete
                </button>
            </div>
        </div>
    </div>
    <div class="divider"></div>
    <div id="deck-info">
        <button id="deck-collapse">+</button>

        <h2 id="deck-title">Deck</h2>

        <input id="deck-file-input" type="file">
        <button id="deck-upload">Import</button>

        <button id="deck-download">Export</button>
    </div>
</div>
</body>
</html>
