<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <script type="module" src="./src.js"></script>
    <link id="favicon" rel="icon"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="background">
    <div id="card-image"></div>
    <div id="blur"></div>
</div>
<div id="foreground">
    <div id="controls">
        <div>
            <label for="group-by">Group by</label>
            <select id="group-by"></select>

            <input id="by-board" type="checkbox" checked>
            <label for="by-board">By Board</label>

            <label for="order-by">Order by</label>
            <select id="order-by"></select>
        </div>
        <div>
            <input id="deck-file-input" type="file">
            <button id="deck-upload-button" class="button">Import</button>

            <button id="deck-download-button" class="button">Export</button>
        </div>
    </div>
    <div id="deck">

    </div>
</div>
</body>
</html>
