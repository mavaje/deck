<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <script type="module" src="./src.js"></script>
    <link id="favicon" rel="icon"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="background">
    <div id="search">
        <div id="search-controls">
            <button id="search-collapse">+</button>
            <input id="search-query" type="text">
            <span id="search-status"></span>
        </div>
        <div id="search-results" class="collapsed">
        </div>
    </div>
    <div id="divider"></div>
    <div id="deck">
        <div id="deck-panel">
            <div>
                <button id="deck-panel-close">x</button>
            </div>
            <div>
                <input id="deck-file-input" type="file">
                <button id="deck-upload-button">Import</button>

                <button id="deck-download-button">Export</button>
            </div>
            <div>
                <input id="by-board" type="checkbox" checked>
                <label for="by-board">By Board</label>
            </div>
            <div>
                <label for="group-by">Group by</label>
                <select id="group-by"></select>
            </div>
            <div>
                <label for="order-by">Order by</label>
                <select id="order-by"></select>
            </div>
        </div>
        <div id="deck-cards" class="compact show-quantity"></div>
        <div id="card-panel" class="collapsed">
            <div id="card-panel-card-container"></div>
            <div>
                <input
                    id="quantity-input"
                    type="number"
                    min="0"
                    max="99"
                    style="width: 5ch"
                >
                <input
                    id="name-input"
                    type="text"
                    placeholder="Card Name"
                    style="flex: 1"
                >
            </div>
            <div>
                <input
                    id="set-input"
                    type="text"
                    placeholder="Set"
                    style="width: 5ch"
                >
                <input
                    id="collector-number-input"
                    type="text"
                    placeholder="Num."
                    style="width: 5ch"
                >
                <span id="print-search" class="text-button">
                    Find prints
                </span>
            </div>
            <div>
                <select id="language-input"></select>
            </div>
            <div>
                <select id="board-input"></select>
            </div>
            <div>
                <select id="finish-input"></select>
            </div>
            <div>
                <select id="condition-input"></select>
            </div>
        </div>
    </div>
</div>
</body>
</html>
