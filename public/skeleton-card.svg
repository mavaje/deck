<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 25 35"
>
    <rect x="0" y="0" width="25" height="35" fill="#000000"/>
    <rect x="2" y="2" width="21" height="31" fill="white" opacity="50%"/>
    
    <g fill="white" stroke="#000000" stroke-width="1">
        <rect x="0.5" y="0.5" width="24" height="3" rx="1.5"/>
        <rect x="0.5" y="19.5" width="24" height="3" rx="1.5"/>
        <rect x="18.5" y="31.5" width="6" height="3" rx="1.5"/>
    </g>
    
    <rect x="0" y="0" width="25" height="35">
        <animate attributeName="fill" values="#0000003f;#000000bf;#0000003f" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>
