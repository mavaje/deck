<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 2 2"
>
    <defs>
        <linearGradient
            id="gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
            spreadMethod="repeat"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0" stop-color="#363636"/>
            <stop offset="0.167" stop-color="#ededed"/>
            <stop offset="0.333" stop-color="#b6b6b6"/>
            <stop offset="0.5" stop-color="#c9c9c9"/>
            <stop offset="0.667" stop-color="#121212"/>
            <stop offset="0.833" stop-color="#494949"/>
            <stop offset="1" stop-color="#363636"/>
        </linearGradient>
    </defs>
    <rect
        x="0"
        y="0"
        width="2"
        height="2"
        fill="url(#gradient)"
    />
</svg>
